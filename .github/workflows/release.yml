name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 编译
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact for test
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeQuickDown
          path: target/x86_64-pc-windows-msvc/release/ClaudeQuickDown.exe
          retention-days: 1

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-msvc/release/ClaudeQuickDown.exe
          body: |
            ## 使用方法
            1. 下载 `ClaudeQuickDown.exe`
            2. 双击运行，点击「是」允许管理员权限
            3. 按照提示填写 API Key，然后回车开始安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 2: 在干净 Windows 环境全流程测试
  # ─────────────────────────────────────────────
  test-windows:
    name: Test on clean Windows
    needs: build-windows
    runs-on: windows-latest

    steps:
      # ── download-artifact@v4 指定 path:. 直接解压到当前目录 ──
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ClaudeQuickDown
          path: .               # 关键：文件落到 .\ClaudeQuickDown.exe

      # ── 确认文件存在（调试用）──────────────────
      - name: List working directory
        shell: powershell
        run: |
          Write-Output "=== 当前目录文件 ==="
          Get-ChildItem -Force
          $exe = ".\ClaudeQuickDown.exe"
          if (Test-Path $exe) {
            $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
            Write-Output "exe found: $mb MB"
          } else {
            Write-Error "ClaudeQuickDown.exe NOT FOUND"; exit 1
          }

      # ── 确认初始环境干净 ──────────────────────
      - name: Verify clean environment
        shell: powershell
        run: |
          Write-Output "=== 确认初始环境干净 ==="
          Write-Output "Node:   $(if (Get-Command node   -EA SilentlyContinue) { node --version   } else { 'NOT FOUND [OK]' })"
          Write-Output "Git:    $(if (Get-Command git    -EA SilentlyContinue) { git --version    } else { 'NOT FOUND [OK]' })"
          Write-Output "Claude: $(if (Get-Command claude -EA SilentlyContinue) { claude --version } else { 'NOT FOUND [OK]' })"

      # ── 写 stdin 输入文件 ──────────────────────
      # 顺序对应程序提示：
      #   y   <- 确认开始安装
      #   n   <- 跳过 cc-switch
      #       <- 跳过 API Key（回车）
      #       <- 跳过 Base URL（回车）
      #       <- 跳过模型（回车）
      #       <- 关闭窗口（回车）
      - name: Prepare stdin input file
        shell: powershell
        run: |
          $lines = @("y", "n", "", "", "", "")
          [System.IO.File]::WriteAllText(
            "$PWD\stdin_input.txt",
            ($lines -join "`r`n") + "`r`n",
            [System.Text.Encoding]::ASCII
          )
          Write-Output "stdin_input.txt written"
          Get-Content ".\stdin_input.txt" | ForEach-Object { Write-Output "  > $_" }

      # ── 运行安装器 ────────────────────────────
      - name: Run installer
        shell: powershell
        run: |
          Write-Output "=== 启动安装器 ==="
          $exe    = Resolve-Path ".\ClaudeQuickDown.exe"
          $stdin  = Resolve-Path ".\stdin_input.txt"
          $stdout = "$PWD\install_stdout.txt"
          $stderr = "$PWD\install_stderr.txt"

          # 预创建输出文件，防止后续 step 找不到
          "" | Out-File $stdout -Encoding utf8
          "" | Out-File $stderr -Encoding utf8

          $proc = Start-Process `
            -FilePath               $exe `
            -RedirectStandardInput  $stdin `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError  $stderr `
            -PassThru -NoNewWindow

          # 最多等 20 分钟
          $done = $proc.WaitForExit(1200000)
          if (-not $done) {
            $proc.Kill()
            Write-Output "=== 安装器超时 ==="
            Get-Content $stdout -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Output "安装器退出，ExitCode = $($proc.ExitCode)"
        continue-on-error: true

      # ── 打印安装器完整输出 ────────────────────
      - name: Print installer output
        if: always()
        shell: powershell
        run: |
          Write-Output "=== stdout ==="
          Get-Content ".\install_stdout.txt" -ErrorAction SilentlyContinue
          Write-Output "=== stderr ==="
          Get-Content ".\install_stderr.txt" -ErrorAction SilentlyContinue

      # ── 刷新 PATH ─────────────────────────────
      - name: Refresh PATH
        if: always()
        shell: powershell
        run: |
          $u = [System.Environment]::GetEnvironmentVariable("Path","User")
          $m = [System.Environment]::GetEnvironmentVariable("Path","Machine")
          $merged = "$m;$u"
          echo "PATH=$merged" >> $env:GITHUB_ENV
          Write-Output "PATH refreshed"

      # ── 验证安装结果 ──────────────────────────
      - name: Check installation results
        if: always()
        shell: powershell
        run: |
          Write-Output "=== 安装结果验证 ==="
          $pass = $true

          if (Get-Command node -EA SilentlyContinue) {
            Write-Output "[OK]  Node:   $(node --version)"
          } else {
            Write-Output "[ERR] Node 未安装"
            $pass = $false
          }

          if (Get-Command git -EA SilentlyContinue) {
            Write-Output "[OK]  Git:    $(git --version)"
          } else {
            Write-Output "[ERR] Git 未安装"
            $pass = $false
          }

          if (Get-Command claude -EA SilentlyContinue) {
            Write-Output "[OK]  Claude: $(claude --version)"
          } else {
            Write-Output "[ERR] Claude CLI 未安装"
            $pass = $false
          }

          $cfgPath = "$env:USERPROFILE\.claude\config.json"
          if (Test-Path $cfgPath) {
            Write-Output "[OK]  ~/.claude/config.json 存在"
            Get-Content $cfgPath
          } else {
            Write-Output "[!!]  ~/.claude/config.json 不存在（跳过 API 配置，属正常）"
          }

          if (-not $pass) { exit 1 }

      # ── 上传日志 ──────────────────────────────
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.ref_name }}
          path: |
            install_stdout.txt
            install_stderr.txt
          if-no-files-found: warn
          retention-days: 14
